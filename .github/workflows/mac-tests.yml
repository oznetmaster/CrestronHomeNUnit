name: Mac UI helper tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Test helpers without app or hardware
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: mac-tests-offline-test-helpers-without-app-or-hardware
      - name: Discover sample without opening a UI session
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: mac-tests-offline-discover-sample-without-opening-a-ui-session
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-offline-${{ matrix.os }}
          path: artifacts/mac/**/*.trx
          if-no-files-found: error
