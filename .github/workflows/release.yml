name: Release

on:
  workflow_dispatch:
    inputs:
      skip_desktop_checks:
        description: Reuse reviewed desktop results; package integrity checks still run
        required: false
        type: boolean
        default: false
      desktop_skip_reason:
        description: Tested source, completion time, frameworks, counts and evidence
        required: false
        type: string
      validation_commit:
        description: Reuse recent CI from an ancestor SHA with only docs or release-automation changes
        required: false
        type: string
      skip_hardware_checks:
        description: Reuse reviewed processor results or record unavailable hardware
        required: false
        type: boolean
        default: false
      hardware_skip_reason:
        description: Tested source, completion time, results and cleanup or unavailability reason
        required: false
        type: string
      documentation_patch:
        description: Publish only the reviewed NuGet documentation patch; preserve existing runtime binaries and GitHub releases
        required: false
        type: boolean
        default: false
      version:
        description: Release version (major.minor.patch, without v)
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: write
  id-token: write

concurrency:
  group: public-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: inputs.documentation_patch != true
    runs-on: windows-latest
    environment: release
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: NuGet/setup-nuget@v2
      - name: Validate explicitly reused test evidence
        if: inputs.skip_desktop_checks == true || inputs.skip_hardware_checks == true || inputs.validation_commit != ''
        uses: oznetmaster/CrestronHomeNUnit/.github/actions/release-validation@2ae8197c6685099c2133e7bb962d1f3568aae9c3
        with:
          required-checks: ${{ vars.RELEASE_REQUIRED_CHECKS }}
          hosted-workflows: '["tests.yml"]'
          skip-desktop-checks: ${{ inputs.skip_desktop_checks }}
          desktop-skip-reason: ${{ inputs.desktop_skip_reason }}
          skip-hardware-checks: ${{ inputs.skip_hardware_checks }}
          hardware-skip-reason: ${{ inputs.hardware_skip_reason }}
          validation-commit: ${{ inputs.validation_commit }}
      - name: Prepare version and release commit
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Run releases from main.' }
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must be major.minor.patch.' }
          if (-not '${{ vars.NUGET_USER }}') { throw 'Configure NUGET_USER and the adapter NuGet Trusted Publishing policy first.' }
          $tag = 'v' + $env:RELEASE_VERSION
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists." }
          ./CrestronHomeNUnit.Driver/BumpDriverVersion.ps1 -ManifestPath ./CrestronHomeNUnit.Driver/CrestronHomeNUnit.Driver.json -Configuration Release -ReleaseVersion $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Version preparation failed.' }
          $path = Join-Path $env:GITHUB_WORKSPACE 'Version.props'
          $text = [IO.File]::ReadAllText($path)
          $text = [regex]::Replace($text, '<Version>[^<]+</Version>', '<Version>' + $env:RELEASE_VERSION + '</Version>')
          [IO.File]::WriteAllText($path, $text)
          $notes = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'RELEASE-NOTES.md'))
          $heading = '# Crestron Home NUnit v' + $env:RELEASE_VERSION
          if (($notes -split '\r?\n', 2)[0] -ne $heading) { throw 'Release notes must match the requested version.' }
          $body = (($notes -split '\r?\n', 2)[1] -split '(?m)^## Updating', 2)[0].Trim()
          if (-not $body) { throw 'Release notes need a change summary.' }
          $changelog = Join-Path $env:GITHUB_WORKSPACE 'CHANGELOG.md'
          $existing = [IO.File]::ReadAllText($changelog)
          # A published changelog must assign every entry to a released version.
          if ($existing -match '(?im)^##\s+\[?Unreleased\]?(?:\s|$)') { throw 'Resolve the Unreleased changelog section before publishing: move pending changes into the release notes or their released version.' }
          if ($existing -match ('(?m)^## \[?' + [regex]::Escape($env:RELEASE_VERSION) + '(?:\]|\s|$)')) { throw 'Changelog already contains this version.' }
          $firstBreak = $existing.IndexOf("`n")
          if ($firstBreak -lt 0) { throw 'Invalid changelog header.' }
          $releaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$env:RELEASE_VERSION"
          $entry = "## [$env:RELEASE_VERSION]($releaseUrl) - $([DateTime]::UtcNow.ToString('yyyy-MM-dd'))`n`n$body`n`n"
          [IO.File]::WriteAllText($changelog, $existing.Substring(0, $firstBreak + 1) + "`n" + $entry + $existing.Substring($firstBreak + 1).TrimStart())
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Version.props CrestronHomeNUnit.Driver/CrestronHomeNUnit.Driver.json CHANGELOG.md
          git commit -m "Release $tag"
          if ($LASTEXITCODE -ne 0) { throw 'Release version commit failed.' }
      - name: Install packaging tools
        shell: pwsh
        run: ./tools/InstallCiTools.ps1
      - name: Prepare optional licensed application icon
        shell: pwsh
        env:
          ICON_DATA: ${{ secrets.RUNNER_ICON_BASE64 }}
        run: |
          if ($env:ICON_DATA) {
            $path = Join-Path $env:RUNNER_TEMP 'Runner.ico'
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:ICON_DATA))
            "RunnerIconPath=$path" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Build and validate release
        shell: pwsh
        env:
          REUSE_DESKTOP: ${{ inputs.skip_desktop_checks }}
          DESKTOP_EVIDENCE: ${{ inputs.desktop_skip_reason }}
        run: ./tools/BuildRelease.ps1 -Version $env:RELEASE_VERSION -ManifestUtilExe $env:MANIFEST_UTIL_EXE -SkipDesktopTests:($env:REUSE_DESKTOP -eq 'true') -DesktopValidationEvidence $env:DESKTOP_EVIDENCE
      - name: Retain validated release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.version }}
          path: artifacts/release/*
          if-no-files-found: error
      - name: Push release commit and annotated tag
        shell: pwsh
        run: |
          $tag = 'v' + $env:RELEASE_VERSION
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Build unexpectedly modified tracked source.' }
          git tag -a $tag -m "Crestron Home NUnit $tag"
          if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed.' }
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Release push failed; main may have advanced.' }
      - name: Obtain short-lived NuGet credential
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish stable test adapter
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/release/CrestronHomeNUnit.TestAdapter.$env:RELEASE_VERSION.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'Adapter NuGet publication failed.' }
      - name: Publish GitHub release
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem artifacts/release -File | Select-Object -ExpandProperty FullName)
          gh release create "v$env:RELEASE_VERSION" @assets --verify-tag --title "Crestron Home NUnit v$env:RELEASE_VERSION" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }

  nuget-documentation:
    if: github.event_name == 'workflow_dispatch' && inputs.documentation_patch == true
    runs-on: windows-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Build and verify documentation-only package
        shell: pwsh
        run: ./tools/New-NuGetDocumentationPatch.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-documentation-patch
          path: artifacts/nuget-documentation/*
          if-no-files-found: error
      - uses: NuGet/login@v1
        id: documentation-login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish verified NuGet documentation patch
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.documentation-login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem artifacts/nuget-documentation -Filter *.nupkg -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one verified package.' }
          dotnet nuget push $packages[0].FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet documentation patch publication failed.' }
