name: Android UI tooling tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Test Android primitives without emulator or hardware
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: android-tests-offline-tests-test-android-primitives-without-emulator-or-hardware
      - name: Discover opt-in UI sample without opening Android
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: android-tests-offline-tests-discover-opt-in-ui-sample-without-opening-android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-offline-test-results
          path: artifacts/android/**/*.trx
          if-no-files-found: error
