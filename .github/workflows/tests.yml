name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Coverage-checker regressions
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-desktop-coverage-checker-regressions
      - name: Packaged metadata regressions
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-desktop-packaged-metadata-regressions
      - name: Package merge resolver regression
        shell: pwsh
        run: |
          dotnet tool install dotnet-ilrepack --version 2.0.45 --tool-path artifacts/merge-tools
          if ($LASTEXITCODE) { throw 'Cannot install pinned merger.' }
          $tool = Get-ChildItem artifacts/merge-tools -Recurse -Filter ILRepackTool.dll | Select-Object -First 1
          if (!$tool) { throw 'Merger assembly not found.' }
          ./tools/Test-MergeAssemblyResolver.ps1 -ToolDirectory $tool.Directory.FullName -ResultsDirectory artifacts/merge-regression
      - name: Build solution without deployment
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-desktop-build-solution-without-deployment
      - name: Runner and transport regressions
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-desktop-runner-and-transport-regressions
      - name: Transport timing regressions
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-desktop-transport-timing-regressions
      - name: CLI client regressions
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-desktop-cli-client-regressions
      - name: Workflow regressions
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-desktop-workflow-regressions
      - name: Test Explorer adapter regressions
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-desktop-test-explorer-adapter-regressions
      - name: Offline workflow discovery
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-desktop-offline-workflow-discovery
      - name: Pack and verify adapter installation
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-desktop-pack-and-verify-adapter-installation
      - name: CLI help
        uses: oznetmaster/BuildAutomation@ae6f311e530a18dc705971dcc655fc97de03e368
        with:
          task: tests-desktop-cli-help
