name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Coverage-checker regressions
        run: ./tools/Test-DiscoveredCoverageGuards.ps1
      - name: Packaged metadata regressions
        run: ./tools/Test-PackageManifestVerification.ps1
      - name: Package merge resolver regression
        shell: pwsh
        run: |
          dotnet tool install dotnet-ilrepack --version 2.0.45 --tool-path artifacts/merge-tools
          if ($LASTEXITCODE) { throw 'Cannot install pinned merger.' }
          $tool = Get-ChildItem artifacts/merge-tools -Recurse -Filter ILRepackTool.dll | Select-Object -First 1
          if (!$tool) { throw 'Merger assembly not found.' }
          ./tools/Test-MergeAssemblyResolver.ps1 -ToolDirectory $tool.Directory.FullName -ResultsDirectory artifacts/merge-regression
      - name: Build solution without deployment
        run: dotnet build CrestronHomeNUnit.sln -c Release -p:CreateDriverPackage=false -p:DeployAfterBuild=false
      - name: Runner and transport regressions
        run: ./CrestronHomeNUnit.TransportValidation/bin/Release/net10.0-windows/CrestronHomeNUnit.TransportValidation.exe
      - name: Transport timing regressions
        run: dotnet test CrestronHomeNUnit.Transport.Tests/CrestronHomeNUnit.Transport.Tests.csproj -c Release --no-build
      - name: CLI client regressions
        run: dotnet test CrestronHomeNUnit.Client.Tests/CrestronHomeNUnit.Client.Tests.csproj -c Release --no-build
      - name: Workflow regressions
        run: dotnet test CrestronHomeNUnit.Workflow.Tests/CrestronHomeNUnit.Workflow.Tests.csproj -c Release --no-build
      - name: Test Explorer adapter regressions
        run: dotnet test CrestronHomeNUnit.TestAdapter.Tests/CrestronHomeNUnit.TestAdapter.Tests.csproj -c Release --no-build
      - name: Offline workflow discovery
        run: dotnet test samples/WorkflowTests/WorkflowTests.csproj -c Release -p:UseSourceAdapter=true --list-tests
      - name: Pack and verify adapter installation
        shell: pwsh
        run: |
          [xml]$props = Get-Content Version.props -Raw
          $version = $props.Project.PropertyGroup.Version
          dotnet pack CrestronHomeNUnit.TestAdapter/CrestronHomeNUnit.TestAdapter.csproj -c Release -o artifacts/adapter
          if ($LASTEXITCODE -ne 0) { throw 'Adapter package build failed.' }
          ./tools/Test-AdapterPackage.ps1 -PackageDirectory artifacts/adapter -Version $version
      - name: CLI help
        run: dotnet CrestronHomeNUnit.Cli/bin/Release/net10.0/CrestronHomeNUnit.Cli.dll --help
